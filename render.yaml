services:
  - type: web
    name: pdf-stamp-api
    runtime: python
    buildCommand: pip install fastapi uvicorn pypdf pillow reportlab python-multipart
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    packages:
      - ghostscript
